name: CI

on:
  push:
    branches: [codex/app]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: x64
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Report installer sizes
        shell: pwsh
        run: Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v6
        with:
          name: ppm-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
