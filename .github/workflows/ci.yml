name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Seed smoke test
        run: pnpm seed -- --archive ./local-data/ci-demo
      - name: Self-contained ppm-mcp (Node SEA) and MCP smoke test
        run: |
          pnpm build:mcp
          node packages/mcp-server/scripts/smoke.mjs apps/desktop/src-tauri/resources/mcp/ppm-mcp ./local-data/ci-demo
      - name: Frontend build (needed by tauri::generate_context)
        run: pnpm --filter @ppm/desktop vite:build
      - name: Rust fmt, clippy, tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  e2e-linux:
    # Clicks through the real app (release build) with tauri-driver + WebKitWebDriver (review F1).
    # Pinned: webkit2gtk-driver is not available under that name on newer Ubuntu images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System libraries, WebKitWebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb openbox
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: e2e
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Build ppm-mcp, the frontends and the app (release)
        run: |
          pnpm build:mcp
          pnpm --filter @ppm/desktop vite:build
          cd apps/desktop/src-tauri && cargo build --release --features tauri/custom-protocol
      - name: E2E (all scripts, each with a fresh synthetic archive)
        run: |
          Xvfb :99 -screen 0 1600x1200x24 &
          sleep 1
          DISPLAY=:99 openbox &
          DISPLAY=:99 tauri-driver &
          sleep 2
          DISPLAY=:99 node apps/desktop/e2e/run-all.mjs --out ./local-data/e2e-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-screenshots
          path: local-data/e2e-ci/**/*.png
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Local CA on Windows (DPAPI-encrypted key, name constraints)
        run: pnpm vitest run packages/mcp-server/test/tls.test.ts
      - name: Installer size
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0}: {1:N0} bytes ({2:N2} MiB)" -f $_.Name, $_.Length, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: ppm-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Demo backup with synthetic data (restore it in the app)
        run: pnpm demo-backup -- --out ./local-data/demo-backup
      - uses: actions/upload-artifact@v4
        with:
          name: ppm-demo-backup
          path: local-data/demo-backup/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ppm-mcpb
          path: packages/mcp-server/dist/ppm.mcpb
          if-no-files-found: error
      - name: Install silently, check PATH and ppm-mcp.exe, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "PPM\resources\mcp"
          $exe = Join-Path $dir "ppm-mcp.exe"
          if (-not (Test-Path $exe)) { throw "ppm-mcp.exe mangler i $dir" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not ($userPath -split ";" | Where-Object { $_ -eq $dir })) { throw "PATH indeholder ikke $dir" }
          & $exe --version
          pnpm seed -- --archive ./local-data/ci-win
          node packages/mcp-server/scripts/smoke.mjs $exe ./local-data/ci-win
          if ($LASTEXITCODE -ne 0) { throw "MCP-røgtest fejlede" }
          # Reinstall while an AI client keeps ppm-mcp.exe running (it locks better_sqlite3.node).
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe
          $psi.Arguments = "--archive ./local-data/ci-win"
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $running = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 2
          if ($running.HasExited) { throw "ppm-mcp.exe stoppede før geninstallationen" }
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          if (-not $running.HasExited) { throw "Installeren stoppede ikke den kørende ppm-mcp.exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "ppm-mcp.exe virker ikke efter geninstallation" }
          node packages/mcp-server/scripts/smoke.mjs $exe ./local-data/ci-win
          if ($LASTEXITCODE -ne 0) { throw "MCP-røgtest fejlede efter geninstallation" }
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA "PPM\uninstall.exe") -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -split ";" | Where-Object { $_ -eq $dir }) { throw "PATH indeholder stadig $dir efter afinstallation" }
          "Installation, PATH, MCP-røgtest og afinstallation er OK"
      - name: E2E in the real app on Windows (WebView2, tauri-driver + msedgedriver)
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          # msedgedriver must match the WebView2 runtime's version, not the Edge browser's.
          cargo install --git https://github.com/chippers/msedgedriver-tool
          New-Item -ItemType Directory -Force -Path local-data/driver | Out-Null
          Push-Location local-data/driver
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          Pop-Location
          $edge = (Resolve-Path local-data/driver/msedgedriver.exe).Path
          $driver = Start-Process -FilePath tauri-driver -ArgumentList "--native-driver", $edge -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          node apps/desktop/e2e/run-all.mjs --skip phase3,mobile-desktop --out ./local-data/e2e-win
          $code = $LASTEXITCODE
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "E2E fejlede på Windows" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-screenshots
          path: local-data/e2e-win/**/*.png
          if-no-files-found: ignore
