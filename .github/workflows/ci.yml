name: CI

on:
  push:
    branches: [codex/app]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: x64
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Report installer sizes
        shell: pwsh
        run: Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v6
        with:
          name: ppm-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Verify release window startup and archive unlock
        shell: pwsh
        run: ./scripts/windows-window-test.ps1
  desktop-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec tauri build --debug --no-bundle --config '{"build":{"devUrl":null}}'
        working-directory: apps/desktop
      - run: pnpm seed -- --archive "$RUNNER_TEMP/ppm-e2e"
      - name: Exercise the WebKit desktop app
        run: |
          XDG_CONFIG_HOME="$RUNNER_TEMP/ppm-config" xvfb-run -a python3 scripts/linux-webdriver.py "$RUNNER_TEMP/ppm-e2e" apps/desktop/src-tauri/target/debug/ppm "$RUNNER_TEMP/ppm-screens"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-screens
          path: ${{ runner.temp }}/ppm-screens
